# Stage-A real application / recorded external transport acceptance stack.
name: financialagent-idq
services:
  mongodb:
    image: mongo:7.0
  redis:
    image: redis:7.2-alpine
  backend:
    image: financialagent-backend:latest
    environment:
      ENVIRONMENT: test
      LLM_PROVIDER: github_copilot
      COPILOT_STATE_DIR: /tmp/idq-fixture
      MONGODB_URL: mongodb://mongodb:27017/idq_e2e
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://host.docker.internal:3014"]'
      SYMBOL_RESOLUTION_LLM_ENABLED: "false"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
    ports: ["127.0.0.1:18096:8000"]
    depends_on: [mongodb, redis]
    command: python -m uvicorn tests.e2e.decision_policy_app:app --host 0.0.0.0 --port 8000
  frontend:
    image: financialagent-frontend:latest
    environment:
      VITE_API_URL: http://host.docker.internal:18096
    volumes:
      - ./frontend:/app
      - dependencies:/app/node_modules
    ports: ["127.0.0.1:3014:3000"]
  browser:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    working_dir: /work/frontend
    environment:
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:3014
      E2E_BACKEND_URL: http://host.docker.internal:18096
      UPDATE_E2E_EVIDENCE: ${UPDATE_E2E_EVIDENCE:-false}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./frontend:/work/frontend
      - ./docs:/work/docs
      - dependencies:/work/frontend/node_modules
    command: npm run test:e2e:decision-safety
volumes:
  dependencies:
    external: true
    name: financialagent-hardening_dependencies
