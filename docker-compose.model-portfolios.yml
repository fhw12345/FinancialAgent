# Synthetic-input/replayed-provider acceptance. Ordinary CI never mounts live credentials.
services:
  backend:
    environment:
      MONGODB_URL: mongodb://mongodb:27017/model_portfolios_e2e
      FINNHUB_API_KEY: dummy
      MODEL_PORTFOLIO_MODE: replay
      COPILOT_STATE_DIR: /tmp/model-portfolios-fixture
    command: python -m uvicorn tests.e2e.model_portfolios_app:app --host 0.0.0.0 --port 8000
  browser:
    volumes:
      - ./backend/artifacts/model-portfolios:/work/backend/artifacts/model-portfolios
    environment:
      MODEL_PORTFOLIO_MODE: replay
    command: npm run test:e2e:model-portfolios
