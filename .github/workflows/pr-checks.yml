name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # 1. Run unit tests (required status check)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Local-Only Compose Bindings
        run: python scripts/check-compose-loopback.py

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Backend Tests
        env:
          MONGODB_URL: mongodb://localhost:27017/test
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Run Deterministic Agent Evaluation
        run: |
          cd backend
          python scripts/run_agent_eval.py --out artifacts/evals

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --passWithNoTests

      - name: Run Project Hardening Browser Smoke
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 > /tmp/financial-agent-vite.log 2>&1 &
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm run test:e2e:project-hardening

      - name: Lint Backend
        run: |
          cd backend
          python -m ruff check src/
          python -m black --check src/

      - name: Lint and Build Frontend
        run: |
          cd frontend
          npm run lint -- --max-warnings 435
          npm run type-check
          npm run build

      - name: Upload Evaluation and Browser Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-reports
          path: |
            backend/artifacts/evals/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
