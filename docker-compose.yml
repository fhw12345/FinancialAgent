services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.development # Load all config from gitignored file
    environment:
      - ENVIRONMENT=development
      - MAESTRO_BASE_URL=http://host.docker.internal:23333/api/anthropic
      - COPILOT_REVERSE_BASE_URL=http://host.docker.internal:8765/cc
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app # Mount full backend directory
      - backend_deps:/home/app/.local # Persist pip user install packages
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend-e2e:
    profiles: ["e2e"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=${E2E_API_URL:-http://host.docker.internal:18081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_e2e_deps:/app/node_modules

  frontend-deep-e2e:
    profiles: ["e2e"]
    image: financialagent-frontend-deep-e2e:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - VITE_API_URL=http://host.docker.internal:18083
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_e2e_deps:/app/node_modules

  frontend-watchlist-e2e:
    profiles: ["e2e"]
    image: financialagent-frontend-deep-e2e:latest
    ports:
      - "3003:3000"
    environment:
      - VITE_API_URL=http://host.docker.internal:18084
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_e2e_deps:/app/node_modules

  frontend-cancel-e2e:
    profiles: ["e2e"]
    image: financialagent-frontend-deep-e2e:latest
    ports:
      - "3004:3000"
    environment:
      - VITE_API_URL=http://host.docker.internal:18085
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_e2e_deps:/app/node_modules

  frontend-streaming-e2e:
    profiles: ["e2e"]
    image: financialagent-frontend-deep-e2e:latest
    ports:
      - "3005:3000"
    environment:
      - VITE_API_URL=http://host.docker.internal:18086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_e2e_deps:/app/node_modules

  frontend-run-e2e:
    profiles: ["e2e"]
    image: financialagent-frontend-deep-e2e:latest
    ports:
      - "3006:3000"
    environment:
      - VITE_API_URL=http://host.docker.internal:18087
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_e2e_deps:/app/node_modules

  frontend-lifecycle-e2e:
    profiles: ["e2e"]
    image: financialagent-frontend-deep-e2e:latest
    ports:
      - "3007:3000"
    environment:
      - VITE_API_URL=http://host.docker.internal:18088
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_e2e_deps:/app/node_modules

  backend-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18081:8000"
    environment:
      - ENVIRONMENT=test
      - MONGODB_URL=mongodb://mongodb:27017/financial_agent_e2e
      - REDIS_URL=redis://redis:6379/1
      - SYMBOL_RESOLUTION_LLM_ENABLED=false
      - CORS_ORIGINS=["http://host.docker.internal:3001"]
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_BASE_URL=http://llm-e2e:8080
      - ANTHROPIC_API_KEY=dummy
      - ANTHROPIC_MODEL=e2e-model
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
      - llm-e2e
    volumes:
      - ./backend:/app

  llm-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18082:8080"
    volumes:
      - ./backend:/app
    command: >
      python -m uvicorn tests.e2e.anthropic_stub:app
      --host 0.0.0.0 --port 8080

  backend-deep-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18083:8000"
    environment:
      - ENVIRONMENT=test
      - MONGODB_URL=mongodb://mongodb:27017/financial_agent_deep_e2e
      - REDIS_URL=redis://redis:6379/2
      - CORS_ORIGINS=["http://host.docker.internal:3002"]
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_BASE_URL=http://llm-e2e:8080
      - ANTHROPIC_API_KEY=dummy
      - ANTHROPIC_MODEL=e2e-model
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
      - llm-e2e
    volumes:
      - ./backend:/app
    command: >
      python -m uvicorn tests.e2e.deep_context_app:app
      --host 0.0.0.0 --port 8000

  backend-watchlist-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18084:8000"
    environment:
      - ENVIRONMENT=test
      - MONGODB_URL=mongodb://mongodb:27017/financial_agent_watchlist_e2e
      - REDIS_URL=redis://redis:6379/3
      - CORS_ORIGINS=["http://host.docker.internal:3003"]
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_BASE_URL=http://llm-e2e:8080
      - ANTHROPIC_API_KEY=dummy
      - ANTHROPIC_MODEL=e2e-model
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
      - llm-e2e
    volumes:
      - ./backend:/app
    command: >
      python -m uvicorn tests.e2e.watchlist_persistence_app:app
      --host 0.0.0.0 --port 8000

  backend-cancel-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18085:8000"
    environment:
      - ENVIRONMENT=test
      - MONGODB_URL=mongodb://mongodb:27017/financial_agent_cancel_e2e
      - REDIS_URL=redis://redis:6379/4
      - CORS_ORIGINS=["http://host.docker.internal:3004"]
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_BASE_URL=http://llm-e2e:8080
      - ANTHROPIC_API_KEY=dummy
      - ANTHROPIC_MODEL=e2e-model
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
      - llm-e2e
    volumes:
      - ./backend:/app
    command: >
      python -m uvicorn tests.e2e.agent_cancellation_app:app
      --host 0.0.0.0 --port 8000

  backend-streaming-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18086:8000"
    environment:
      - ENVIRONMENT=test
      - MONGODB_URL=mongodb://mongodb:27017/financial_agent_streaming_e2e
      - REDIS_URL=redis://redis:6379/5
      - CORS_ORIGINS=["http://host.docker.internal:3005"]
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_BASE_URL=http://llm-e2e:8080
      - ANTHROPIC_API_KEY=dummy
      - ANTHROPIC_MODEL=e2e-model
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
      - llm-e2e
    volumes:
      - ./backend:/app
    command: >
      python -m uvicorn tests.e2e.streaming_semantics_app:app
      --host 0.0.0.0 --port 8000

  backend-run-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18087:8000"
    environment:
      - ENVIRONMENT=test
      - MONGODB_URL=mongodb://mongodb:27017/financial_agent_run_e2e
      - REDIS_URL=redis://redis:6379/6
      - CORS_ORIGINS=["http://host.docker.internal:3006"]
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_BASE_URL=http://llm-e2e:8080
      - ANTHROPIC_API_KEY=dummy
      - ANTHROPIC_MODEL=e2e-model
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
      - llm-e2e
    volumes:
      - ./backend:/app
    command: >
      python -m uvicorn tests.e2e.shared_run_app:app
      --host 0.0.0.0 --port 8000

  backend-lifecycle-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18088:8000"
    environment:
      - ENVIRONMENT=test
      - MONGODB_URL=mongodb://mongodb:27017/financial_agent_lifecycle_e2e
      - REDIS_URL=redis://redis:6379/7
      - CORS_ORIGINS=["http://host.docker.internal:3007"]
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_BASE_URL=http://llm-e2e:8080
      - ANTHROPIC_API_KEY=dummy
      - ANTHROPIC_MODEL=e2e-model
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - redis
      - llm-e2e
    volumes:
      - ./backend:/app
    command: >
      python -m uvicorn tests.e2e.shared_lifecycle_app:app
      --host 0.0.0.0 --port 8000

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    working_dir: /work/frontend
    environment:
      - PLAYWRIGHT_BASE_URL=http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/work/frontend
      - frontend_e2e_deps:/work/frontend/node_modules
      - ./docs:/work/docs
    depends_on:
      - frontend-e2e
      - backend-e2e
      - llm-e2e
    command: >
      sh -c "until curl -fsS http://host.docker.internal:18081/api/health;
      do sleep 2; done;
      npm run test:e2e"

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=financial_agent
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  backend_deps: # Persist Python packages across restarts
  frontend_e2e_deps:
